<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/tara-logo.png" />
    <link rel="apple-touch-icon" href="/images/tara-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cooking Thozhan — AI-powered smart recipe finder. Why fear when your THOZHAN is here!" />
    <title>Cooking Thozhan — Why fear when your THOZHAN is here!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme before first paint to prevent flash of wrong theme.
      // Defaults to dark mode when no preference is saved.
      (function () {
        try {
          var t = localStorage.getItem('ct_theme');
          var dark = t ? JSON.parse(t) === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
